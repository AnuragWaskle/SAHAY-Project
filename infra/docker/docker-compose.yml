services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sahay-civic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahay
      POSTGRES_USER: sahay
      POSTGRES_PASSWORD: sahay_dev_pw
    ports:
      - "5434:5432"
    volumes:
      - sahay_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahay -d sahay"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sahay-civic-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: sahay_minio
      MINIO_ROOT_PASSWORD: sahay_minio_pw
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - sahay_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sahay_pgdata:
  sahay_miniodata:
